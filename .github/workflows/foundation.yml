name: Foundation checks

on:
  pull_request:
    paths:
      - "agent-os/**"
      - ".github/workflows/foundation.yml"
  push:
    branches:
      - main
      - codex/arpit-foundation
    paths:
      - "agent-os/**"
      - ".github/workflows/foundation.yml"

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-os
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run python -m pytest

  web-control-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-os/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: agent-os/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
